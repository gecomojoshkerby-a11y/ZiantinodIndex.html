<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        table {
            border: 1px solid #111111;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 4px 4px 0px #111111;
            border-radius: 6px;
            overflow: hidden;
            width: 320px;
        }

        thead {
            background-color: #111111;
            color: #ffffff;
            text-align: center;
        }

        h2 {
            margin: 0;
            padding: 14px;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        tbody td {
            padding: 12px 15px;
            color: #111111;
            font-size: 13px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #111111;
            background-color: #ffffff;
            border-radius: 4px;
            font-size: 13px;
            color: #111111;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            background-color: #f4f4f4;
            box-shadow: 0 0 0 2px #111111;
        }

        tfoot td {
            padding: 15px;
            text-align: center;
            color: #666666;
            font-size: 12px;
            border-top: 1px solid #eeeeee;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 8px;
        }

        input[type="submit"] {
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #111111;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        input[type="submit"]:hover {
            background-color: #333333;
        }

        input[type="reset"] {
            background-color: #ffffff;
            color: #111111;
            border: 1px solid #111111;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        input[type="reset"]:hover {
            background-color: #111111;
            color: #ffffff;
        }

        .home-link {
            margin-top: 20px;
            text-align: center;
        }

        .home-link a {
            color: #111111;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            border: 1px solid #111111;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .home-link a:hover {
            background-color: #111111;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <form>
        <table>
            <thead>
                <tr>
                    <td colspan="2">
                        <h2>Portal Login</h2>
                    </td>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>
                        <label for="username">Username:</label>
                    </td>
                    <td>
                        <input type="text"
                               id="username"
                               name="username"
                               placeholder="Enter Username"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="password">Password:</label>
                    </td>
                    <td>
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Enter Password"
                               required>
                    </td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="2">
                        <div class="button-group">
                            <input type="submit" value="Submit">
                            <input type="reset" value="Reset">
                        </div>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Created by: Ziantino
                    </td>
                </tr>
            </tfoot>
        </table>
    </form>
    
    <p class="home-link"><a href="portfolio.html">Home</a></p>

</body>
</html>
