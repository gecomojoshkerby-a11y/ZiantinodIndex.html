<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag And Drop</title>
    <link rel="stylesheet" href="DragAndDrop.css">
    <script src="DragAndDrop.js" defer></script>
</head>
<body>
    <a href="portfolio.html">Home</a>
    <h1>Drag And Drop API</h1>

    <div class="draggableContainer">
        <div class="box" draggable="true" id="box1">draggable1</div>
        <div class="box" draggable="true" id="box2">draggable2</div>
        <div class="box" draggable="true" id="box3">draggable3</div>
        <div class="box" draggable="true" id="box4">draggable4</div>
    </div>

    <div class="droppableContainer">
        <div class="droppable" id="drop1">droppable1</div>
        <div class="droppable" id="drop2">droppable2</div>
        <div class="droppable" id="drop3">droppable3</div>
        <div class="droppable" id="drop4">droppable4</div>
    </div>
</body>
</html>
